<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>선덕고 부수기</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;touch-action:none;font-family:system-ui;background:#b9ddf7}#ui{position:fixed;top:10px;left:10px;padding:11px 12px;border-radius:13px;background:#ffffffe8;z-index:3;box-shadow:0 3px 14px #0002}#score{font-weight:800;margin:4px 0 8px}#tip{position:fixed;right:10px;top:10px;background:#ffffffe0;border-radius:10px;padding:8px;font-size:12px;z-index:3;text-align:right}#tools{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;max-width:98vw;overflow-x:auto;padding:4px;z-index:3}button{border:0;border-radius:10px;padding:11px 10px;background:#fff;font-weight:800;white-space:nowrap;box-shadow:0 2px 7px #0002}button.sel{background:#ffcf54;outline:2px solid #8e6412}@media(max-width:600px){button{font-size:11px;padding:10px 8px}#ui{font-size:12px}#tip{font-size:10px;top:auto;bottom:70px}}
</style></head><body>
<div id="ui"><b>🏫 선덕고 부수기</b><div id="score">파괴: 0%</div><button id="reset">🔄 다시 만들기</button></div>
<div id="tip">드래그: 시점 회전<br>터치: 무기 사용 · 확대: 두 손가락</div><div id="tools"></div>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0xb9ddf7);
const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x65768a,2.2));const sun=new T.DirectionalLight(0xffffff,2.3);sun.position.set(20,35,15);scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(140,140),new T.MeshLambertMaterial({color:0x80b778}));ground.rotation.x=-Math.PI/2;scene.add(ground);
let blocks=[],parts=[],effects=[],projectiles=[],total=0,tool=0,az=.65,el=.45,dist=43,shake=0,tornado=null;
const weapons=['💣 폭탄 · 약함','☄️ 운석 · 강함','🌎 지진 · 전체 붕괴','⚡ 번개 · 정밀 타격','🌪️ 토네이도 · 광역'];
weapons.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{tool=i;document.querySelectorAll('#tools button').forEach((x,j)=>x.classList.toggle('sel',i===j))};document.querySelector('#tools').appendChild(b)});document.querySelector('#tools button').classList.add('sel');
function build(){[...blocks,...parts.map(p=>p.m),...effects.map(e=>e.m),...projectiles.map(p=>p.m)].forEach(m=>scene.remove(m));if(tornado){scene.remove(tornado.group);tornado=null}blocks=[];parts=[];effects=[];projectiles=[];
const colors=[0xd8d1c3,0xc9c1b4,0x98b7d1,0xe1d8c7];
for(let y=0;y<7;y++)for(let x=0;x<16;x++)for(let z=0;z<5;z++){if(y%3!==0&&z>0&&z<4&&x>0&&x<15)continue;const m=new T.Mesh(new T.BoxGeometry(1.3,1.3,1.3),new T.MeshLambertMaterial({color:colors[y%3===1?2:(x+y+z)%2]}));m.position.set((x-7.5)*1.32,y*1.32+.67,(z-2)*1.32);
/* Load-bearing columns and blocks close to them are more durable. */
const isColumn=(x===7)&&(z===0||z===4);const nearColumn=(Math.abs(x-7)<=2)&&(z===0||z===4);const reinforced=isColumn||(nearColumn&&Math.random()<.38);m.userData.maxHp=isColumn?4:reinforced?2+Math.floor(Math.random()*2):1;m.userData.hp=m.userData.maxHp;
scene.add(m);blocks.push(m)}
const sign=new T.Mesh(new T.BoxGeometry(4.1,.72,.18),new T.MeshLambertMaterial({color:0x234f73}));sign.position.set(0,2.05,3.6);scene.add(sign);blocks.push(sign);
for(let x=-2;x<=2;x++){const m=new T.Mesh(new T.BoxGeometry(1.05,.38,.8),new T.MeshLambertMaterial({color:0x777e88}));m.position.set(x*1.35,9.55,0);scene.add(m);blocks.push(m)}
total=blocks.length;update()}
function update(){document.querySelector('#score').textContent='파괴: '+Math.round((1-blocks.length/total)*100)+'%'}
document.querySelector('#reset').onclick=build;build();
const ray=new T.Raycaster(),pointer=new T.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,az,el};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;az=down.az+(down.x-e.clientX)*.008;el=Math.max(.12,Math.min(1.35,down.el+(e.clientY-down.y)*.008))});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>12)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(blocks)[0];if(!hit)return;const target=hit.point.clone();if(tool===0)throwBomb(target);else if(tool===1)throwMeteor(target);else if(tool===2)quake();else if(tool===3)lightning(target);else startTornado(target)});
renderer.domElement.addEventListener('wheel',e=>dist=Math.max(18,Math.min(90,dist+e.deltaY*.035)),{passive:true});
let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(18,Math.min(90,dist+(pinch-d)*.07));pinch=d}else pinch=0},{passive:true});
function addEffect(m,life,kind='fade'){scene.add(m);effects.push({m,life,max:life,kind})}
function ring(pos,color=0xffa32a){const m=new T.Mesh(new T.TorusGeometry(.55,.09,8,32),new T.MeshBasicMaterial({color,transparent:true,opacity:.95}));m.rotation.x=Math.PI/2;m.position.copy(pos);addEffect(m,26,'ring')}
function throwBomb(target){const m=new T.Group();const body=new T.Mesh(new T.SphereGeometry(.34,16,12),new T.MeshStandardMaterial({color:0x252525,metalness:.35,roughness:.5}));m.add(body);const fuse=new T.Mesh(new T.SphereGeometry(.11,8,8),new T.MeshBasicMaterial({color:0xff5a12}));fuse.position.set(.15,.25,0);m.add(fuse);
const start=new T.Vector3(camera.position.x*.5,Math.max(11,camera.position.y*.68),camera.position.z*.5);m.position.copy(start);scene.add(m);projectiles.push({m,start,target:target.clone(),t:0,duration:42,kind:'bomb'});}
function throwMeteor(target){const m=new T.Group();const rock=new T.Mesh(new T.SphereGeometry(.78,24,18),new T.MeshStandardMaterial({color:0x282522,emissive:0xff4b0b,emissiveIntensity:1.6,roughness:.8}));m.add(rock);const glow=new T.Mesh(new T.SphereGeometry(.91,20,16),new T.MeshBasicMaterial({color:0xff6a1a,transparent:true,opacity:.22,side:T.BackSide}));m.add(glow);const start=new T.Vector3(target.x+9,Math.max(22,target.y+18),target.z+10);m.position.copy(start);scene.add(m);projectiles.push({m,start,target:target.clone(),t:0,duration:30,kind:'meteor',trailClock:0});}
function shatter(i,center,power=1){const b=blocks[i];
/* Reinforced supports need repeated hits; heavy attacks deal extra damage. */
if(b.userData.maxHp&&b.userData.maxHp>1){const damage=power>=1.8?2:1;b.userData.hp-=damage;if(b.userData.hp>0){const ratio=b.userData.hp/b.userData.maxHp;if(b.material&&b.material.color)b.material.color.lerp(new T.Color(0x555b62),.18);b.scale.setScalar(.94+ratio*.06);return}}
blocks.splice(i,1);const pos=b.position.clone(),color=b.material?.color?.getHex()??0xb9b9b9;scene.remove(b);const n=2+Math.floor(Math.random()*4);for(let j=0;j<n;j++){const s=.22+Math.random()*.5,m=new T.Mesh(new T.TetrahedronGeometry(s),new T.MeshLambertMaterial({color:new T.Color(color).offsetHSL((Math.random()-.5)*.04,0,(Math.random()-.5)*.14)}));m.position.copy(pos).add(new T.Vector3((Math.random()-.5)*.8,(Math.random()-.5)*.8,(Math.random()-.5)*.8));m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);scene.add(m);let d=m.position.clone().sub(center);if(d.length()<.1)d.set(Math.random()-.5,.5,Math.random()-.5);d.normalize();parts.push({m,v:new T.Vector3(d.x*(.12+Math.random()*.4)*power,.25+Math.random()*.4+power*.12,d.z*(.12+Math.random()*.4)*power),spin:new T.Vector3(Math.random()*.2,Math.random()*.2,Math.random()*.2),life:100+Math.random()*60})}}
function blast(target,kind){ring(target,kind==='meteor'?0xff5b1c:0xffb52d);shake=kind==='meteor'?26:13;const radius=kind==='meteor'?8:3.4;const chance=kind==='meteor'?.98:.68;for(let i=blocks.length-1;i>=0;i--)if(blocks[i].position.distanceTo(target)<radius&&Math.random()<chance)shatter(i,target,kind==='meteor'?2:1);update()}
function quake(){
shake=35;ring(new T.Vector3(0,.22,0),0xc3d0dc);ring(new T.Vector3(0,.24,0),0xffffff);
for(let i=blocks.length-1;i>=0;i--){const b=blocks[i],p=b.position.clone();const center=new T.Vector3(p.x*.12,0,p.z*.12);shatter(i,center,.28);
for(let j=parts.length-1;j>=Math.max(0,parts.length-5);j--){const q=parts[j];q.v.y=-.03-Math.random()*.07;q.v.x+=(Math.random()-.5)*.08;q.v.z+=(Math.random()-.5)*.08;q.life=190+Math.random()*90}}
update()}

function lightning(target){// Extra-thick, bright main bolt with multiple jagged branches and impact flash.
const points=[new T.Vector3(target.x+1.8,24,target.z-1.4)];let y=24;while(y>target.y+1){y-=1.1;points.push(new T.Vector3(target.x+(Math.random()-.5)*2.7,y,target.z+(Math.random()-.5)*2.7))}points.push(target.clone());
const geom=new T.BufferGeometry().setFromPoints(points);addEffect(new T.Line(geom,new T.LineBasicMaterial({color:0x1d7dff})),22,'fade');addEffect(new T.Line(new T.BufferGeometry().setFromPoints(points),new T.LineBasicMaterial({color:0x8feaff})),18,'fade');addEffect(new T.Line(new T.BufferGeometry().setFromPoints(points),new T.LineBasicMaterial({color:0xffffff})),12,'fade');
for(let k=0;k<points.length-2;k++){if(Math.random()<.9){const a=points[k],b=points[k+1],end=b.clone().add(new T.Vector3((Math.random()-.5)*7,-2.2,(Math.random()-.5)*7));const branch=[a.clone(),b.clone(),end];addEffect(new T.Line(new T.BufferGeometry().setFromPoints(branch),new T.LineBasicMaterial({color:0x63dfff})),16,'fade');addEffect(new T.Line(new T.BufferGeometry().setFromPoints(branch),new T.LineBasicMaterial({color:0xffffff})),9,'fade')}}
const flash=new T.Mesh(new T.SphereGeometry(2.1,18,14),new T.MeshBasicMaterial({color:0xe6ffff,transparent:true,opacity:1}));flash.position.copy(target);addEffect(flash,14,'flash');ring(target,0x8bf5ff);ring(target,0xffffff);shake=32;
for(let i=blocks.length-1;i>=0;i--){const b=blocks[i],dx=Math.abs(b.position.x-target.x),dz=Math.abs(b.position.z-target.z);if(dx<3.6&&dz<3.8&&Math.random()<.99)shatter(i,target,2.1)}update()}
function startTornado(target){if(tornado){scene.remove(tornado.group);tornado=null}const group=new T.Group();group.position.set(target.x,0,target.z);scene.add(group);
for(let j=0;j<6;j++){const y=j*1.05,r=.55+j*.42;const mesh=new T.Mesh(new T.TorusGeometry(r,.16+j*.025,7,28),new T.MeshBasicMaterial({color:j%2?0xb9c6d0:0x8d9da9,transparent:true,opacity:.52}));mesh.position.y=y+1;mesh.rotation.x=Math.PI/2;group.add(mesh)}
const funnel=new T.Mesh(new T.CylinderGeometry(3.1,.38,7.5,24,1,true),new T.MeshBasicMaterial({color:0x9ba9b6,transparent:true,opacity:.16,side:T.DoubleSide}));funnel.position.y=4;group.add(funnel);tornado={group,target:target.clone(),life:300,phase:0};shake=8}
function frame(){requestAnimationFrame(frame);if(shake>0)shake--;camera.position.set(Math.sin(az)*Math.cos(el)*dist+(shake?(Math.random()-.5)*shake*.03:0),Math.sin(el)*dist+4+(shake?(Math.random()-.5)*shake*.025:0),Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,4,0);
for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.t++;const t=Math.min(1,p.t/p.duration);const prev=p.m.position.clone();p.m.position.lerpVectors(p.start,p.target,t);p.m.position.y+=Math.sin(t*Math.PI)*(p.kind==='bomb'?8:5);p.m.rotation.x+=.18;p.m.rotation.z+=.13;if(p.kind==='meteor'&&p.t%2===0){const trail=new T.Mesh(new T.SphereGeometry(.16+Math.random()*.14,8,8),new T.MeshBasicMaterial({color:Math.random()<.5?0xff4a0a:0xffb13b,transparent:true,opacity:.85}));trail.position.copy(prev);addEffect(trail,22,'flash');const streak=new T.Line(new T.BufferGeometry().setFromPoints([prev,p.m.position.clone()]),new T.LineBasicMaterial({color:0xff6a1b,transparent:true,opacity:.7}));addEffect(streak,15,'fade')}if(t>=1){scene.remove(p.m);projectiles.splice(i,1);blast(p.target,p.kind)}}
if(tornado){const tw=tornado;tw.life--;tw.phase+=.16;tw.group.rotation.y+=.12;tw.group.children.forEach((m,i)=>{if(m.geometry.type==='TorusGeometry'){m.rotation.z=tw.phase*(i%2?1:-1);m.position.x=Math.sin(tw.phase+i)*.22}});tw.group.position.x=tw.target.x+Math.sin(tw.phase*.55)*2.6;tw.group.position.z=tw.target.z+Math.cos(tw.phase*.45)*2.6;
for(let i=blocks.length-1;i>=0;i--){const b=blocks[i],dx=b.position.x-tw.group.position.x,dz=b.position.z-tw.group.position.z,d=Math.hypot(dx,dz);if(d<4.2&&Math.random()<.035){const c=new T.Vector3(tw.group.position.x,b.position.y,tw.group.position.z);shatter(i,c,1.2)}}
for(const p of parts){const dx=tw.group.position.x-p.m.position.x,dz=tw.group.position.z-p.m.position.z,d=Math.hypot(dx,dz);if(d<7){p.v.x+=dx*.0015;p.v.z+=dz*.0015;p.v.y+=.006;p.m.position.y+=.015}}
if(tw.life%30===0)update();if(tw.life<=0){scene.remove(tw.group);tornado=null;update()}}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.v.y-=.018;p.m.position.add(p.v);p.m.rotation.x+=p.spin.x;p.m.rotation.y+=p.spin.y;p.m.rotation.z+=p.spin.z;if(p.m.position.y<.2){p.m.position.y=.2;p.v.y*=-.28;p.v.x*=.8;p.v.z*=.8}if(--p.life<=0){scene.remove(p.m);parts.splice(i,1)}}
for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life--;if(e.kind==='ring'){const s=1+(e.max-e.life)*.2;e.m.scale.setScalar(s);e.m.material.opacity=Math.max(0,e.life/e.max)}else if(e.m.material?.transparent)e.m.material.opacity=Math.max(0,e.life/e.max);if(e.life<=0){scene.remove(e.m);effects.splice(i,1)}}
renderer.render(scene,camera)}
frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
