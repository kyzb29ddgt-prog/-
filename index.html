<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>선덕고 부수기</title><style>body{margin:0;background:#b9ddf7;font-family:system-ui;overflow:hidden}#ui{position:fixed;top:12px;left:12px;background:#ffffffdd;padding:12px;border-radius:12px}#tools{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px}button{border:0;border-radius:9px;padding:11px;background:white;font-weight:bold}button.sel{background:#ffcc58}#tip{position:fixed;top:12px;right:12px;background:#ffffffcc;padding:8px;border-radius:9px;font-size:12px}</style><div id="ui"><b>🏫 선덕고 부수기</b><div id="score">파괴: 0%</div><button id="reset">다시 만들기</button></div><div id="tip">드래그: 회전 · 두 손가락: 확대<br>건물 터치: 도구 사용</div><div id="tools"></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const scene=new T.Scene();scene.background=new T.Color(0xb9ddf7);const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x65768a,2.2));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(20,35,15);scene.add(sun);const ground=new T.Mesh(new T.PlaneGeometry(140,140),new T.MeshLambertMaterial({color:0x80b778}));ground.rotation.x=-Math.PI/2;scene.add(ground);let blocks=[],parts=[],total=0,tool=0,az=.65,el=.45,dist=43;const names=['💣 작은 폭탄','🌎 지진','☄️ 운석','⚡ 번개','🌪️ 토네이도'];names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{tool=i;document.querySelectorAll('#tools button').forEach((x,j)=>x.classList.toggle('sel',i===j))};document.querySelector('#tools').appendChild(b)});document.querySelector('#tools button').classList.add('sel');const mat=[0xd8d1c3,0xc9c1b4,0x98b7d1];function build(){blocks.forEach(b=>scene.remove(b));parts.forEach(p=>scene.remove(p.m));blocks=[];parts=[];for(let y=0;y<7;y++)for(let x=0;x<16;x++)for(let z=0;z<5;z++){if(y%3!==0&&z>0&&z<4&&x>0&&x<15)continue;let m=new T.Mesh(new T.BoxGeometry(1.3,1.3,1.3),new T.MeshLambertMaterial({color:mat[y%3===1?2:(x+y+z)%2]}));m.position.set((x-7.5)*1.32,y*1.32+.67,(z-2)*1.32);scene.add(m);blocks.push(m)}total=blocks.length;update()}function update(){document.querySelector('#score').textContent='파괴: '+Math.round((1-blocks.length/total)*100)+'%'}document.querySelector('#reset').onclick=build;build();const ray=new T.Raycaster(),pointer=new T.Vector2();let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,az,el};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;az=down.az+(down.x-e.clientX)*.008;el=Math.max(.12,Math.min(1.35,down.el+(e.clientY-down.y)*.008))});renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;let moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>12)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);let hits=ray.intersectObjects(blocks);if(!hits.length)return;let center=hits[0].object.position.clone();let radius=[3.4,99,6,3.8,7][tool];for(let i=blocks.length-1;i>=0;i--){let b=blocks[i],d=b.position.distanceTo(center);let remove=tool===1?(b.position.y<3.4&&Math.random()<.55):d<radius&&(Math.random()<([.94,1,.78,.82,.72][tool]));if(remove){blocks.splice(i,1);let dir=b.position.clone().sub(center).normalize();parts.push({m:b,v:new T.Vector3(dir.x*(.12+Math.random()*.3),.18+Math.random()*.32,dir.z*(.12+Math.random()*.3)),life:110});}}update()});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(18,Math.min(90,dist+e.deltaY*.035))},{passive:true});let pinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(18,Math.min(90,dist+(pinch-d)*.07));pinch=d}else pinch=0},{passive:true});function frame(){requestAnimationFrame(frame);camera.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist+4,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,4,0);for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.v.y-=.018;p.m.position.add(p.v);p.m.rotation.x+=.045;p.m.rotation.z+=.025;if(p.m.position.y<.65){p.m.position.y=.65;p.v.y*=-.35;p.v.x*=.86;p.v.z*=.86}if(--p.life<=0){scene.remove(p.m);parts.splice(i,1)}}renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></html>
